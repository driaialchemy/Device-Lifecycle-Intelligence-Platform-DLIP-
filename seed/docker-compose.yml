name: devicepassport

services:
  dp-db:
    image: postgres:16
    container_name: dp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devicepassport
    ports:
      - "5432:5432"
    volumes:
      - dp_pgdata:/var/lib/postgresql/data

  dp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dp-app
    env_file:
      - .env
    depends_on:
      - dp-db
    ports:
      - "8501:8501"

volumes:
  dp_pgdata:
